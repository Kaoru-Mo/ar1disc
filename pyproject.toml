[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ar1disc"
version = "0.1.0"
description = "Discretize AR(1) processes into finite-state Markov chains (Tauchen's method)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kaoru Motohashi" }]
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest", "quantecon"]

[tool.setuptools.packages.find]
where = ["src"]
